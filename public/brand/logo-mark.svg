<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Elegant Deep Midnight Indigo Canvas -->
  <rect width="100" height="100" rx="24" fill="#201A42"/>

  <!-- Architectural Minimalist "L" Monogram -->
  <!-- Precision engineered continuous stroke representing the Letter L and an open road curve -->
  <path 
    d="M36 24 V68 C36 73.5 40.5 78 46 78 H74" 
    stroke="#FFFFFF" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Subtle Refined Horizon Accent (Golden Precision Notch) -->
  <line 
    x1="52" 
    y1="78" 
    x2="74" 
    y2="78" 
    stroke="#F5B800" 
    stroke-width="7" 
    stroke-linecap="round"
  />
</svg>
