<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1000 430" width="1000" height="430" fill="none">
  <defs>
    <linearGradient id="c4Pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A58DF6"/>
      <stop offset="50%" stop-color="#9375ED"/>
      <stop offset="100%" stop-color="#7B56DE"/>
    </linearGradient>
    <linearGradient id="c4Roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B29CFA"/>
      <stop offset="100%" stop-color="#8F71EC"/>
    </linearGradient>
    <linearGradient id="c4Hood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E6FE8"/>
      <stop offset="40%" stop-color="#7B58DB"/>
      <stop offset="100%" stop-color="#6741C9"/>
    </linearGradient>
    <linearGradient id="c4Dash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C479B"/>
      <stop offset="40%" stop-color="#342D7C"/>
      <stop offset="100%" stop-color="#241E5C"/>
    </linearGradient>
    <linearGradient id="c4Seat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C68DA"/>
      <stop offset="100%" stop-color="#5842B8"/>
    </linearGradient>
    <linearGradient id="c4HudGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="40%" stop-color="#EDFBF4" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="c4WindshieldSheen" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="c4DriverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1344" flood-opacity="0.3"/>
    </filter>
    <filter id="c4HudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201850" flood-opacity="0.25"/>
    </filter>

    <!-- Checkered Shirt Pattern for Indian Instructor -->
    <pattern id="checkShirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#DC2626"/>
      <rect x="0" y="0" width="8" height="16" fill="#1E3A8A" opacity="0.6"/>
      <rect x="0" y="0" width="16" height="8" fill="#1E3A8A" opacity="0.6"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- 1. SEATS -->
  <g fill="url(#c4Seat)">
    <rect x="365" y="240" width="85" height="55" rx="16"/>
    <rect x="395" y="290" width="25" height="20" fill="#4B399E"/>
    <path d="M345 305 C345 295 470 295 470 305 L475 440 L340 440 Z"/>
    <rect x="560" y="240" width="130" height="60" rx="18"/>
    <rect x="612" y="295" width="26" height="20" fill="#4B399E"/>
    <path d="M530 310 C530 298 700 298 700 310 L705 440 L525 440 Z"/>
  </g>

  <!-- 2. DRIVER IN TRIUMPHANT CELEBRATION POSE (Right hand giving thumbs-up 👍, broad victorious smile) -->
  <g id="driver-celebrate" filter="url(#c4DriverShadow)">
    <path d="M275 380 C265 310 295 240 370 230 C445 220 465 295 450 370 C440 410 420 440 405 440 C370 440 360 410 330 430 C300 450 280 430 275 380 Z" fill="#472621"/>

    <rect x="355" y="340" width="35" height="45" rx="10" fill="#F8B896"/>
    <ellipse cx="338" cy="305" rx="7" ry="11" fill="#F8B896"/>
    <path d="M340 285 C335 245 365 235 390 238 C420 242 430 270 425 305 C420 345 390 355 365 352 C345 350 342 315 340 285 Z" fill="#FFCBB0"/>

    <ellipse cx="355" cy="318" rx="9" ry="5" fill="#F79679" opacity="0.75"/>
    <ellipse cx="405" cy="316" rx="9" ry="5" fill="#F79679" opacity="0.65"/>

    <!-- Joyful Eyes -->
    <path d="M366 288 Q 374 278 382 288" stroke="#201515" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M400 286 Q 408 276 416 286" stroke="#201515" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Broad Happy Smile with Teeth -->
    <path d="M380 316 Q 394 336 408 316 Z" fill="#FFFFFF"/>
    <path d="M380 316 Q 394 336 408 316" stroke="#8A3D28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Front Hair Bangs -->
    <path d="M342 265 C355 240 405 242 425 258 C410 262 385 260 365 285 C355 298 348 315 346 335 C336 305 338 278 342 265 Z" fill="#58312B"/>
    <path d="M422 262 C435 285 435 320 428 350 C418 335 418 300 422 262 Z" fill="#58312B"/>

    <!-- Yellow Top (Shirt) -->
    <path d="M310 395 C335 375 415 375 440 395 L 455 450 L 295 450 Z" fill="#FFDE17"/>
    <path d="M352 380 Q 375 395 398 380" stroke="#E5C200" stroke-width="3" fill="none"/>

    <!-- Seatbelt -->
    <polygon points="268,360 292,350 425,480 395,490" fill="#252445"/>

    <!-- Left Hand Resting on Wheel Base -->
    <path d="M305 405 C290 420 280 445 280 470 C290 478 308 465 315 450 Z" fill="#FFDE17"/>
    <path d="M280 460 C276 468 282 485 295 490 C310 492 322 478 320 465 C315 452 295 452 280 460 Z" fill="#F8B896"/>

    <!-- RIGHT HAND GIVING A PROUD THUMBS UP 👍 (Raised in foreground) -->
    <!-- Forearm lifting up -->
    <path d="M425 410 C445 395 460 365 470 335 C485 345 475 385 455 425 Z" fill="#FFDE17"/>
    <!-- Hand & Fist -->
    <rect x="462" y="325" width="22" height="24" rx="8" fill="#F8B896"/>
    <!-- Folded Fingers -->
    <line x1="465" y1="332" x2="480" y2="332" stroke="#E29775" stroke-width="2"/>
    <line x1="465" y1="338" x2="480" y2="338" stroke="#E29775" stroke-width="2"/>
    <line x1="465" y1="344" x2="480" y2="344" stroke="#E29775" stroke-width="2"/>
    <!-- Extended Proud Thumb (Pointing UP) -->
    <path d="M465 328 C462 315 464 300 472 295 C478 292 484 298 482 310 L480 328 Z" fill="#F8B896"/>
    <path d="M470 300 Q 474 295 477 300" stroke="#E29775" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Sparkle Stars Around Her Celebration -->
    <polygon points="495,290 497,295 502,297 497,299 495,304 493,299 488,297 493,295" fill="#FFE033"/>
    <polygon points="340,240 342,244 346,245 342,247 340,251 338,247 334,245 338,244" fill="#FFE033"/>
  </g>

  <!-- 3. STEERING WHEEL (Safely Parked at Test Center) -->
  <g id="wheel">
    <circle cx="365" cy="460" r="105" stroke="#3A3E94" stroke-width="24" fill="none"/>
    <circle cx="365" cy="460" r="105" stroke="#4F54BD" stroke-width="6" fill="none" opacity="0.6"/>
    <circle cx="365" cy="460" r="32" fill="#2E317A"/>
    <circle cx="365" cy="460" r="28" fill="#3D429F"/>
    
    <path d="M272 478 L 335 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M275 478 L 335 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    <path d="M458 478 L 395 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M455 478 L 395 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    <path d="M365 492 L 365 565" stroke="#3A3E94" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- 4. DASHBOARD -->
  <g id="dash">
    <path d="M80 440 L 920 440 L 960 495 L 40 495 Z" fill="url(#c4Dash)"/>
    <line x1="80" y1="440" x2="920" y2="440" stroke="#635DB8" stroke-width="3"/>
    <ellipse cx="365" cy="445" rx="80" ry="14" fill="#6962D4" opacity="0.4"/>
  </g>

  <!-- 5. THE INSTRUCTOR (Indian male in 40s, celebrating with official PASS certificate) -->
  <g id="instructor-celebrating" filter="url(#c4DriverShadow)">
    <path d="M580 252 C580 220 608 210 635 212 C665 210 690 225 690 255 C690 280 685 305 675 320 L675 355 L585 355 L585 320 C578 305 580 275 580 252 Z" fill="#1A181C"/>
    
    <!-- Neck -->
    <rect x="608" y="325" width="46" height="42" rx="10" fill="#B3734A"/>
    <path d="M608 340 Q 631 352 654 340 L 654 365 L 608 365 Z" fill="#995E39" opacity="0.4"/>

    <!-- Head & Face (Beaming with victory celebration) -->
    <path d="M592 270 C590 230 615 225 632 225 C655 225 675 235 675 275 C675 320 660 342 633 342 C608 342 594 315 592 270 Z" fill="#C5855A"/>

    <!-- Ears -->
    <ellipse cx="589" cy="285" rx="8" ry="14" fill="#B3734A"/>
    <ellipse cx="590" cy="285" rx="4" ry="8" fill="#995E39" opacity="0.6"/>
    <ellipse cx="674" cy="285" rx="7" ry="13" fill="#B3734A"/>

    <!-- Hair (Neat side-part with distinguished temple styling) -->
    <path d="M584 252 C585 225 612 210 635 210 C662 210 684 225 684 250 C680 255 670 242 655 240 C635 238 610 248 584 252 Z" fill="#1F1D22"/>
    <path d="M584 248 C584 265 588 275 592 278 L592 258 Z" fill="#1F1D22"/>
    <path d="M587 260 Q 590 270 592 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M674 260 Q 672 270 670 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyebrows (Excited, celebrating) -->
    <path d="M602 265 Q 614 258 624 264" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M640 264 Q 650 258 662 265" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Big radiant happy smile) -->
    <ellipse cx="614" cy="278" rx="5.5" ry="6.5" fill="#1B130E"/>
    <circle cx="613" cy="276" r="2" fill="#FFFFFF"/>
    <ellipse cx="650" cy="278" rx="5.5" ry="6.5" fill="#1B130E"/>
    <circle cx="649" cy="276" r="2" fill="#FFFFFF"/>

    <!-- Nose & Mustache -->
    <path d="M632 274 L 634 296 L 626 300" stroke="#995E39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M610 310 C620 306 630 309 632 311 C634 309 644 306 654 310 C658 312 650 322 632 320 C614 322 606 312 610 310 Z" fill="#1F1D22"/>

    <!-- Huge Proud Grin -->
    <path d="M618 322 Q 632 336 646 322" stroke="#7A3F1F" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Body: Check Shirt -->
    <g id="instructor-shirt-celebrate">
      <path d="M555 365 C580 350 680 350 710 365 L 725 450 L 535 450 Z" fill="url(#checkShirt)"/>
      <polygon points="610,360 632,385 620,365" fill="#DC2626"/>
      <polygon points="610,360 632,385 620,365" fill="url(#checkShirt)"/>
      <polygon points="654,360 632,385 644,365" fill="#DC2626"/>
      <polygon points="654,360 632,385 644,365" fill="url(#checkShirt)"/>
      <path d="M608 358 L 632 385 L 656 358" stroke="#1E3A8A" stroke-width="2" fill="none"/>

      <line x1="632" y1="385" x2="632" y2="450" stroke="#B91C1C" stroke-width="8"/>
      <circle cx="632" cy="398" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="418" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="438" r="2.5" fill="#FFFFFF"/>

      <!-- Arms Holding Official Pass Certificate -->
      <!-- Left Hand -->
      <path d="M555 375 C538 390 525 410 520 430 L 548 436 Z" fill="url(#checkShirt)"/>
      <!-- Right Hand -->
      <path d="M700 375 C715 390 725 410 720 430 L 692 436 Z" fill="url(#checkShirt)"/>

      <!-- Official Green PASS Certificate Sheet -->
      <g transform="translate(545, 345)">
        <rect x="0" y="0" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
        <rect x="10" y="10" width="110" height="24" rx="5" fill="#10B981"/>
        <text x="65" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PASSED! ✓</text>
        
        <circle cx="30" cy="58" r="14" fill="#FFDE17"/>
        <text x="30" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#065F46" text-anchor="middle">1st</text>
        <line x1="52" y1="52" x2="115" y2="52" stroke="#334155" stroke-width="2.5"/>
        <line x1="52" y1="64" x2="95" y2="64" stroke="#64748B" stroke-width="2"/>

        <!-- Hands holding edges of the certificate -->
        <ellipse cx="-4" cy="50" rx="8" ry="6" fill="#C5855A"/>
        <ellipse cx="134" cy="50" rx="8" ry="6" fill="#C5855A"/>
      </g>
    </g>

    <!-- Seatbelt -->
    <polygon points="685,355 708,348 575,480 550,490" fill="#252445"/>
    <line x1="695" y1="352" x2="565" y2="485" stroke="#3A386D" stroke-width="2"/>
  </g>

  <!-- 6. FOREGROUND CHASSIS FRAME -->
  <g id="outer-frame">
    <polygon points="120,225 880,225 940,440 60,440" fill="url(#c4WindshieldSheen)"/>
    <rect x="470" y="222" width="60" height="22" rx="7" fill="#4B399E"/>
    <rect x="495" y="208" width="10" height="15" fill="#3A2D7C"/>

    <path d="M40 480 C180 470 820 470 960 480 L 1000 620 L 0 620 Z" fill="url(#c4Hood)"/>
    <path d="M80 488 C240 480 760 480 920 488 L 945 540 C800 535 200 535 55 540 Z" fill="#9377EE" opacity="0.5"/>

    <!-- Classic Driving School "L" Plate Sticker on Hood -->
    <g id="learner-l-sticker">
      <rect x="477" y="490" width="46" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="479" y="492" width="42" height="42" rx="6" fill="#FFFFFF"/>
      <rect x="481" y="494" width="38" height="38" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8" stroke-opacity="0.25"/>
      <path d="M492 500 L 499 500 L 499 524 L 514 524 L 514 530 L 492 530 Z" fill="#DC2626"/>
    </g>

    <path d="M0 620 L 60 490 L 175 235 C185 215 215 200 250 200 L 750 200 C785 200 815 215 825 235 L 940 490 L 1000 620 L 940 620 L 870 450 L 795 240 C790 230 775 225 750 225 L 250 225 C225 225 210 230 205 240 L 130 450 L 60 620 Z" fill="url(#c4Pillar)"/>
    <path d="M220 220 L 780 220 L 760 205 L 240 205 Z" fill="url(#c4Roof)"/>

    <polygon points="120,440 135,440 245,225 235,225" fill="#7552D8"/>
    <polygon points="880,440 865,440 755,225 765,225" fill="#7552D8"/>
  </g>
</svg>
