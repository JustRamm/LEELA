<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1000 430" width="1000" height="430" fill="none">
  <defs>
    <!-- Car Frame Gradients -->
    <linearGradient id="c2Pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A58DF6"/>
      <stop offset="50%" stop-color="#9375ED"/>
      <stop offset="100%" stop-color="#7B56DE"/>
    </linearGradient>
    <linearGradient id="c2Roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B29CFA"/>
      <stop offset="100%" stop-color="#8F71EC"/>
    </linearGradient>
    <linearGradient id="c2Hood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E6FE8"/>
      <stop offset="40%" stop-color="#7B58DB"/>
      <stop offset="100%" stop-color="#6741C9"/>
    </linearGradient>
    <linearGradient id="c2Dash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C479B"/>
      <stop offset="40%" stop-color="#342D7C"/>
      <stop offset="100%" stop-color="#241E5C"/>
    </linearGradient>
    <linearGradient id="c2Seat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C68DA"/>
      <stop offset="100%" stop-color="#5842B8"/>
    </linearGradient>
    <linearGradient id="c2HudGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#EAE6FF" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#D6CEF8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="c2WindshieldSheen" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="c2DriverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1344" flood-opacity="0.3"/>
    </filter>
    <filter id="c2HudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201850" flood-opacity="0.25"/>
    </filter>

    <!-- Checkered Shirt Pattern for Indian Instructor -->
    <pattern id="checkShirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#DC2626"/>
      <rect x="0" y="0" width="8" height="16" fill="#1E3A8A" opacity="0.6"/>
      <rect x="0" y="0" width="16" height="8" fill="#1E3A8A" opacity="0.6"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- 1. SEATS -->
  <g fill="url(#c2Seat)">
    <rect x="365" y="240" width="85" height="55" rx="16"/>
    <rect x="395" y="290" width="25" height="20" fill="#4B399E"/>
    <path d="M345 305 C345 295 470 295 470 305 L475 440 L340 440 Z"/>
    <rect x="560" y="240" width="130" height="60" rx="18"/>
    <rect x="612" y="295" width="26" height="20" fill="#4B399E"/>
    <path d="M530 310 C530 298 700 298 700 310 L705 440 L525 440 Z"/>
  </g>

  <!-- 2. DRIVER IN ACTIVE TURNING POSE (Tilted slightly into the turn, looking toward roundabout) -->
  <g id="driver-turning" filter="url(#c2DriverShadow)" transform="rotate(-3 380 320)">
    <!-- Back Hair -->
    <path d="M270 380 C260 310 290 235 365 225 C440 215 460 290 448 365 C438 405 418 435 402 435 C368 435 358 405 325 425 C295 445 275 425 270 380 Z" fill="#472621"/>

    <!-- Neck & Face -->
    <rect x="352" y="338" width="35" height="45" rx="10" fill="#F8B896"/>
    <ellipse cx="335" cy="302" rx="7" ry="11" fill="#F8B896"/>
    <path d="M338 282 C332 242 362 232 388 235 C418 238 428 268 422 302 C418 342 388 352 362 348 C342 346 340 312 338 282 Z" fill="#FFCBB0"/>

    <!-- Blush -->
    <ellipse cx="352" cy="315" rx="8" ry="4" fill="#F79679" opacity="0.6"/>
    <ellipse cx="402" cy="313" rx="8" ry="4" fill="#F79679" opacity="0.5"/>

    <!-- Eyes (Glancing attentively to the left into the curve) -->
    <ellipse cx="368" cy="288" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="369" cy="286" r="1.8" fill="#FFFFFF"/>
    <ellipse cx="402" cy="286" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="403" cy="284" r="1.8" fill="#FFFFFF"/>

    <!-- Eyebrows & Smile (Focused confidence) -->
    <path d="M362 276 Q 370 270 378 274" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M396 274 Q 404 269 412 273" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M388 292 L 391 304 L 386 306" stroke="#E5997B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M380 318 Q 390 326 398 317" stroke="#8A3D28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Hair Bangs -->
    <path d="M338 262 C352 238 402 238 422 255 C408 258 382 256 362 282 C352 295 345 312 342 332 C332 302 335 275 338 262 Z" fill="#58312B"/>
    <path d="M418 258 C432 282 432 318 425 348 C415 332 415 298 418 258 Z" fill="#58312B"/>

    <!-- Yellow Top (Shirt) -->
    <path d="M305 392 C330 372 410 372 435 392 L 452 450 L 290 450 Z" fill="#FFDE17"/>
    <path d="M348 378 Q 370 392 392 378" stroke="#E5C200" stroke-width="3" fill="none"/>

    <!-- Seatbelt -->
    <polygon points="265,358 288,348 422 480 392,490" fill="#252445"/>

    <!-- DYNAMIC ARMS (Actively steering into the curve) -->
    <!-- Left Arm & Hand (pulled down to 7 o'clock) -->
    <path d="M300 405 C275 425 265 455 255 480 C265 490 290 480 305 460 Z" fill="#FFDE17"/>
    <path d="M255 470 C250 478 254 495 268 502 C282 506 302 495 304 480 C300 468 275 462 255 470 Z" fill="#F8B896"/>

    <!-- Right Arm & Hand (reaching up to 1 o'clock on rotated wheel) -->
    <path d="M420 405 C435 410 455 418 468 435 C458 445 438 442 422 428 Z" fill="#FFDE17"/>
    <path d="M445 410 C440 418 446 438 458 444 C475 448 490 435 488 422 C482 408 460 405 445 410 Z" fill="#F8B896"/>
  </g>

  <!-- 3. ACTIVELY ROTATED STEERING WHEEL (-25 deg turn) -->
  <g id="steering-wheel-turning" transform="rotate(-25 365 460)">
    <circle cx="365" cy="460" r="105" stroke="#3A3E94" stroke-width="24" fill="none"/>
    <circle cx="365" cy="460" r="105" stroke="#4F54BD" stroke-width="6" fill="none" opacity="0.6"/>
    <circle cx="365" cy="460" r="32" fill="#2E317A"/>
    <circle cx="365" cy="460" r="28" fill="#3D429F"/>
    
    <path d="M272 478 L 335 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M275 478 L 335 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    <path d="M458 478 L 395 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M455 478 L 395 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    <path d="M365 492 L 365 565" stroke="#3A3E94" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- 4. DASHBOARD -->
  <g id="dash">
    <path d="M80 440 L 920 440 L 960 495 L 40 495 Z" fill="url(#c2Dash)"/>
    <line x1="80" y1="440" x2="920" y2="440" stroke="#635DB8" stroke-width="3"/>
    <ellipse cx="365" cy="445" rx="80" ry="14" fill="#6962D4" opacity="0.4"/>
  </g>

  <!-- 5. THE INSTRUCTOR (Indian male in 40s, guiding steering & roundabouts in check shirt) -->
  <g id="instructor-turning" filter="url(#c2DriverShadow)" transform="rotate(-2 630 330)">
    <!-- Back Hair & Silhouette -->
    <path d="M580 252 C580 220 608 210 635 212 C665 210 690 225 690 255 C690 280 685 305 675 320 L675 355 L585 355 L585 320 C578 305 580 275 580 252 Z" fill="#1A181C"/>
    
    <!-- Neck -->
    <rect x="608" y="325" width="46" height="42" rx="10" fill="#B3734A"/>
    <path d="M608 340 Q 631 352 654 340 L 654 365 L 608 365 Z" fill="#995E39" opacity="0.4"/>

    <!-- Head & Face (Looking attentively toward the steering wheel and mirrors) -->
    <path d="M590 270 C588 230 614 225 632 225 C655 225 675 235 675 275 C675 320 660 342 633 342 C608 342 592 315 590 270 Z" fill="#C5855A"/>

    <!-- Ears -->
    <ellipse cx="587" cy="285" rx="8" ry="14" fill="#B3734A"/>
    <ellipse cx="588" cy="285" rx="4" ry="8" fill="#995E39" opacity="0.6"/>
    <ellipse cx="674" cy="285" rx="7" ry="13" fill="#B3734A"/>

    <!-- Hair (Neat side-part with distinguished temple styling) -->
    <path d="M582 252 C583 225 610 210 635 210 C662 210 684 225 684 250 C680 255 670 242 655 240 C635 238 608 248 582 252 Z" fill="#1F1D22"/>
    <path d="M582 248 C582 265 586 275 590 278 L590 258 Z" fill="#1F1D22"/>
    <path d="M585 260 Q 588 270 590 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M674 260 Q 672 270 670 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyebrows (Coaching, reassuring expression) -->
    <path d="M598 266 Q 610 260 622 265" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M638 265 Q 648 260 660 266" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Focused glance toward the roundabout / student's hands) -->
    <ellipse cx="610" cy="278" rx="5" ry="6" fill="#1B130E"/>
    <circle cx="608" cy="276" r="1.8" fill="#FFFFFF"/>

    <ellipse cx="646" cy="278" rx="5" ry="6" fill="#1B130E"/>
    <circle cx="644" cy="276" r="1.8" fill="#FFFFFF"/>

    <!-- Nose & Mustache -->
    <path d="M628 274 L 630 297 L 622 301" stroke="#995E39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M608 311 C618 307 626 310 628 312 C630 310 638 307 648 311 C652 313 646 321 628 319 C610 321 604 313 608 311 Z" fill="#1F1D22"/>
    <path d="M618 324 Q 628 331 638 324" stroke="#7A3F1F" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Body: Check Shirt -->
    <g id="instructor-shirt-turning">
      <path d="M555 365 C580 350 680 350 710 365 L 725 450 L 535 450 Z" fill="url(#checkShirt)"/>
      
      <!-- Collar -->
      <polygon points="610,360 632,385 620,365" fill="#DC2626"/>
      <polygon points="610,360 632,385 620,365" fill="url(#checkShirt)"/>
      <polygon points="654,360 632,385 644,365" fill="#DC2626"/>
      <polygon points="654,360 632,385 644,365" fill="url(#checkShirt)"/>
      <path d="M608 358 L 632 385 L 656 358" stroke="#1E3A8A" stroke-width="2" fill="none"/>

      <!-- Front Placket & Buttons -->
      <line x1="632" y1="385" x2="632" y2="450" stroke="#B91C1C" stroke-width="8"/>
      <circle cx="632" cy="398" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="418" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="438" r="2.5" fill="#FFFFFF"/>

      <!-- Left Hand Guiding Curve ("Feed the wheel smoothly") -->
      <path d="M555 375 C535 385 510 405 490 425 C495 435 515 432 530 415 Z" fill="url(#checkShirt)"/>
      <path d="M490 418 C480 422 470 435 480 445 C492 452 510 445 515 432 Z" fill="#C5855A"/>
      <path d="M480 430 Q 470 428 460 432" stroke="#B3734A" stroke-width="3" stroke-linecap="round"/>
      <path d="M482 436 Q 472 435 464 440" stroke="#B3734A" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Right Arm (Holding Lesson Notes) -->
      <path d="M700 375 C715 390 725 410 730 435 L 695 440 Z" fill="url(#checkShirt)"/>
      <g transform="translate(670, 360) rotate(-4)">
        <rect x="0" y="0" width="58" height="72" rx="5" fill="#854D0E"/>
        <rect x="3" y="6" width="52" height="62" rx="3" fill="#F8FAFC"/>
        <line x1="8" y1="16" x2="35" y2="16" stroke="#334155" stroke-width="2.5"/>
        <path d="M40 16 L 44 20 L 50 14" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="8" y1="28" x2="38" y2="28" stroke="#334155" stroke-width="2.5"/>
        <path d="M40 28 L 44 32 L 50 26" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <ellipse cx="10" cy="55" rx="9" ry="6" fill="#C5855A"/>
      </g>
    </g>

    <!-- Seatbelt -->
    <polygon points="685,355 708,348 575,480 550,490" fill="#252445"/>
    <line x1="695" y1="352" x2="565" y2="485" stroke="#3A386D" stroke-width="2"/>
  </g>

  <!-- 6. FOREGROUND CHASSIS FRAME -->
  <g id="outer-frame">
    <polygon points="120,225 880,225 940,440 60,440" fill="url(#c2WindshieldSheen)"/>
    <rect x="470" y="222" width="60" height="22" rx="7" fill="#4B399E"/>
    <rect x="495" y="208" width="10" height="15" fill="#3A2D7C"/>

    <path d="M40 480 C180 470 820 470 960 480 L 1000 620 L 0 620 Z" fill="url(#c2Hood)"/>
    <path d="M80 488 C240 480 760 480 920 488 L 945 540 C800 535 200 535 55 540 Z" fill="#9377EE" opacity="0.5"/>

    <!-- Classic Driving School "L" Plate Sticker on Hood -->
    <g id="learner-l-sticker">
      <rect x="477" y="490" width="46" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="479" y="492" width="42" height="42" rx="6" fill="#FFFFFF"/>
      <rect x="481" y="494" width="38" height="38" rx="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8" stroke-opacity="0.25"/>
      <path d="M492 500 L 499 500 L 499 524 L 514 524 L 514 530 L 492 530 Z" fill="#DC2626"/>
    </g>

    <path d="M0 620 L 60 490 L 175 235 C185 215 215 200 250 200 L 750 200 C785 200 815 215 825 235 L 940 490 L 1000 620 L 940 620 L 870 450 L 795 240 C790 230 775 225 750 225 L 250 225 C225 225 210 230 205 240 L 130 450 L 60 620 Z" fill="url(#c2Pillar)"/>
    <path d="M220 220 L 780 220 L 760 205 L 240 205 Z" fill="url(#c2Roof)"/>

    <polygon points="120,440 135,440 245,225 235,225" fill="#7552D8"/>
    <polygon points="880,440 865,440 755,225 765,225" fill="#7552D8"/>
  </g>
</svg>
