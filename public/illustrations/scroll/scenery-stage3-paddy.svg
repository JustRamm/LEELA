<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1000 430" width="1000" height="430" fill="none">
  <defs>
    <linearGradient id="sc3Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C80F2"/>
      <stop offset="45%" stop-color="#BFAAF7"/>
      <stop offset="75%" stop-color="#FCE19D"/>
      <stop offset="100%" stop-color="#FFD738"/>
    </linearGradient>
    <linearGradient id="sc3Road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#554291"/>
      <stop offset="100%" stop-color="#211746"/>
    </linearGradient>
    <linearGradient id="sc3TerraceFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B61C8"/>
      <stop offset="100%" stop-color="#513B93"/>
    </linearGradient>
    <linearGradient id="sc3TerraceNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C2A78"/>
      <stop offset="100%" stop-color="#1E1442"/>
    </linearGradient>
  </defs>

  <!-- Sky matches hero naturally -->

  <!-- Distant Mountain Ridges -->
  <path d="M0 240 Q 250 195 500 220 T 1000 205 L 1000 320 L 0 320 Z" fill="#7154BA" opacity="0.45"/>

  <!-- Upper Stepped Terraces (Left & Right) -->
  <path d="M0 260 C240 235 440 270 500 270 C560 270 760 235 1000 260 L 1000 370 L 0 370 Z" fill="url(#sc3TerraceFar)"/>
  <path d="M0 260 C240 235 440 270 500 270" stroke="#FFDE17" stroke-width="2" stroke-opacity="0.6" fill="none"/>
  <path d="M500 270 C560 270 760 235 1000 260" stroke="#FFDE17" stroke-width="2" stroke-opacity="0.6" fill="none"/>

  <!-- Water Mirror in Terraced Fields (Soft Lavender Sky Reflections) -->
  <ellipse cx="260" cy="285" rx="140" ry="16" fill="#CBB7F7" opacity="0.4"/>
  <ellipse cx="740" cy="285" rx="140" ry="16" fill="#CBB7F7" opacity="0.4"/>

  <!-- Lower Terraces -->
  <path d="M0 320 C220 285 420 330 500 330 C580 330 780 285 1000 320 L 1000 450 L 0 450 Z" fill="url(#sc3TerraceNear)"/>
  <path d="M0 320 C220 285 420 330 500 330" stroke="#FFDE17" stroke-width="2.5" stroke-opacity="0.5" fill="none"/>
  <path d="M500 330 C580 330 780 285 1000 320" stroke="#FFDE17" stroke-width="2.5" stroke-opacity="0.5" fill="none"/>

  <!-- Countryside Palm Silhouettes -->
  <g fill="#2D1C5E" opacity="0.75">
    <ellipse cx="140" cy="270" rx="14" ry="22"/>
    <ellipse cx="160" cy="265" rx="16" ry="26"/>
    <ellipse cx="840" cy="265" rx="16" ry="26"/>
    <ellipse cx="860" cy="270" rx="14" ry="22"/>
  </g>

  <!-- Winding Scenic Driving Road Weaving Through Terraces -->
  <polygon points="488,270 512,270 830,620 170,620" fill="url(#sc3Road)"/>

  <!-- Golden Center Road Markers (Fast Driving Smooth Motion) -->
  <line x1="500" y1="280" x2="500" y2="305" stroke="#FFE033" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="500" y1="325" x2="500" y2="360" stroke="#FFE033" stroke-width="4" stroke-linecap="round"/>
  <line x1="500" y1="385" x2="500" y2="435" stroke="#FFE033" stroke-width="6" stroke-linecap="round"/>
  <line x1="500" y1="465" x2="500" y2="500" stroke="#FFE033" stroke-width="8" stroke-linecap="round"/>
</svg>
