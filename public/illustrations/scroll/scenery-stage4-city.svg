<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1000 430" width="1000" height="430" fill="none">
  <defs>
    <linearGradient id="sc4Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE442"/>
      <stop offset="50%" stop-color="#FFCE20"/>
      <stop offset="100%" stop-color="#F5A400"/>
    </linearGradient>
    <linearGradient id="sc4Road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B4A93"/>
      <stop offset="100%" stop-color="#261A50"/>
    </linearGradient>
    <linearGradient id="sc4Building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#846ACF"/>
      <stop offset="100%" stop-color="#4F3696"/>
    </linearGradient>
  </defs>

  <!-- Sky matches hero naturally -->

  <!-- Distant City Skyline Silhouette -->
  <g fill="#D89200" opacity="0.6">
    <rect x="180" y="200" width="40" height="80"/>
    <rect x="230" y="170" width="55" height="110"/>
    <rect x="295" y="210" width="45" height="70"/>
    <rect x="670" y="190" width="50" height="90"/>
    <rect x="730" y="160" width="60" height="120"/>
    <rect x="800" y="205" width="45" height="75"/>
  </g>

  <!-- Driving Test Centre Building (Right Side) -->
  <g transform="translate(680, 200)">
    <rect width="190" height="140" rx="8" fill="url(#sc4Building)"/>
    <rect x="15" y="20" width="160" height="35" rx="6" fill="#201A42"/>
    <text x="95" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#FFE033" text-anchor="middle" letter-spacing="1">TEST CENTRE</text>
    
    <!-- Test Center Windows -->
    <rect x="25" y="75" width="35" height="40" rx="4" fill="#FFE033" opacity="0.9"/>
    <rect x="75" y="75" width="35" height="40" rx="4" fill="#FFE033" opacity="0.9"/>
    <rect x="125" y="75" width="40" height="65" rx="4" fill="#201A42"/>
  </g>

  <!-- Green Traffic Light (Left Side - "Go / Pass") -->
  <g transform="translate(180, 180)">
    <!-- Pole -->
    <rect x="18" y="70" width="8" height="140" fill="#201A42" rx="4"/>
    <!-- Housing -->
    <rect width="44" height="100" rx="10" fill="#201A42"/>
    <!-- Red light (off) -->
    <circle cx="22" cy="22" r="10" fill="#5A2222"/>
    <!-- Amber light (off) -->
    <circle cx="22" cy="50" r="10" fill="#5A4A18"/>
    <!-- Green light (Glowing ON) -->
    <circle cx="22" cy="78" r="12" fill="#10B981"/>
    <circle cx="22" cy="78" r="6" fill="#A7F3D0"/>
  </g>

  <!-- Test Route Road Surface with Parallel Parking Bays -->
  <polygon points="480,250 520,250 860,620 140,620" fill="url(#sc4Road)"/>

  <!-- Parallel Parking Bay Lines on Right Road Shoulder -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="620" y1="360" x2="710" y2="360"/>
    <line x1="710" y1="360" x2="760" y2="440"/>
    <line x1="670" y1="440" x2="760" y2="440"/>
  </g>

  <!-- Finish Line Checkered Strip at the Test Center Entrance -->
  <g transform="translate(300, 470)">
    <polygon points="0,0 400,0 415,25 0,25" fill="#FFFFFF"/>
    <polygon points="0,0 50,0 50,12 0,12" fill="#201A42"/>
    <polygon points="100,0 150,0 150,12 100,12" fill="#201A42"/>
    <polygon points="200,0 250,0 250,12 200,12" fill="#201A42"/>
    <polygon points="300,0 350,0 350,12 300,12" fill="#201A42"/>
    <polygon points="50,12 100,12 100,25 50,25" fill="#201A42"/>
    <polygon points="150,12 200,12 200,25 150,25" fill="#201A42"/>
    <polygon points="250,12 300,12 300,25 250,25" fill="#201A42"/>
    <polygon points="350,12 400,12 400,25 350,25" fill="#201A42"/>
  </g>
</svg>
