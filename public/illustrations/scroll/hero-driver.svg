<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE633"/>
      <stop offset="70%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#FCBD00"/>
    </linearGradient>

    <!-- Forest Silhouette Gradients -->
    <linearGradient id="treeGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE866" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F7C81A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="treeGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C418"/>
      <stop offset="100%" stop-color="#EAA605"/>
    </linearGradient>
    <linearGradient id="treeGradNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0B50A"/>
      <stop offset="100%" stop-color="#D98E00"/>
    </linearGradient>

    <!-- Car Frame Gradients -->
    <linearGradient id="carPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A58DF6"/>
      <stop offset="50%" stop-color="#9375ED"/>
      <stop offset="100%" stop-color="#7B56DE"/>
    </linearGradient>

    <linearGradient id="carRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B29CFA"/>
      <stop offset="100%" stop-color="#8F71EC"/>
    </linearGradient>

    <linearGradient id="carHoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E6FE8"/>
      <stop offset="40%" stop-color="#7B58DB"/>
      <stop offset="100%" stop-color="#6741C9"/>
    </linearGradient>

    <!-- Dashboard and Interior Gradients -->
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C479B"/>
      <stop offset="40%" stop-color="#342D7C"/>
      <stop offset="100%" stop-color="#241E5C"/>
    </linearGradient>

    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C68DA"/>
      <stop offset="100%" stop-color="#5842B8"/>
    </linearGradient>

    <!-- Holographic GPS HUD Glass -->
    <linearGradient id="glassHudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#EAE6FF" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#D6CEF8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Windshield Sheen -->
    <linearGradient id="windshieldSheen" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="hudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201850" flood-opacity="0.25"/>
    </filter>

    <filter id="driverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1344" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. SUNNY GOLDEN BACKDROP -->
  <rect width="1000" height="620" rx="20" fill="url(#skyGrad)"/>

  <!-- 2. SCENIC PINE TREES (Left and Right Horizon Silhouettes) -->
  <!-- Left Far Trees -->
  <g fill="url(#treeGradFar)">
    <!-- Tree 1 -->
    <polygon points="120,40 135,110 105,110"/>
    <polygon points="120,80 145,160 95,160"/>
    <polygon points="120,130 160,240 80,240"/>
    <polygon points="120,200 175,340 65,340"/>
    <!-- Tree 2 (Smaller) -->
    <polygon points="210,130 222,180 198,180"/>
    <polygon points="210,160 230,230 190,230"/>
    <polygon points="210,210 242,300 178,300"/>
  </g>

  <!-- Left Mid Trees -->
  <g fill="url(#treeGradMid)">
    <!-- Prominent Tree Left -->
    <polygon points="65,90 82,150 48,150"/>
    <polygon points="65,130 95,210 35,210"/>
    <polygon points="65,180 110,290 20,290"/>
    <polygon points="65,260 125,380 5,380"/>
  </g>

  <!-- Right Far Trees -->
  <g fill="url(#treeGradFar)">
    <polygon points="860,50 875,120 845,120"/>
    <polygon points="860,95 885,175 835,175"/>
    <polygon points="860,145 900,250 820,250"/>
    <polygon points="860,215 918,350 802,350"/>

    <polygon points="760,140 772,190 748,190"/>
    <polygon points="760,170 780,240 740,240"/>
    <polygon points="760,220 792,310 728,310"/>
  </g>

  <!-- Right Near Trees -->
  <g fill="url(#treeGradNear)">
    <polygon points="925,80 942,145 908,145"/>
    <polygon points="925,125 955,210 895,210"/>
    <polygon points="925,180 970,290 880,290"/>
    <polygon points="925,250 985,380 865,380"/>
  </g>

  <!-- Distant warm rolling hills -->
  <path d="M0 380 Q 250 330 500 355 T 1000 340 L 1000 480 L 0 480 Z" fill="#F0BA08" opacity="0.65"/>
  <path d="M0 395 Q 350 360 700 375 T 1000 370 L 1000 500 L 0 500 Z" fill="#E2A600" opacity="0.8"/>

  <!-- 3. CAR SEATS AND HEADRESTS -->
  <!-- Driver Seat (Left) -->
  <g fill="url(#seatGrad)">
    <!-- Headrest -->
    <rect x="365" y="240" width="85" height="55" rx="16" />
    <rect x="395" y="290" width="25" height="20" fill="#4B399E"/>
    <!-- Seat Back -->
    <path d="M345 305 C345 295 470 295 470 305 L475 440 L340 440 Z"/>
  </g>

  <!-- Passenger Seat (Right) -->
  <g fill="url(#seatGrad)">
    <!-- Headrest -->
    <rect x="560" y="240" width="130" height="60" rx="18"/>
    <rect x="612" y="295" width="26" height="20" fill="#4B399E"/>
    <!-- Seat Back -->
    <path d="M530 310 C530 298 700 298 700 310 L705 440 L525 440 Z"/>
  </g>

  <!-- 4. THE DRIVER (Learner Girl Character) -->
  <g id="driver-character" filter="url(#driverShadow)">
    <!-- Back Hair -->
    <path d="M275 380 C265 310 295 240 370 230 C445 220 465 295 450 370 C440 410 420 440 405 440 C370 440 360 410 330 430 C300 450 280 430 275 380 Z" fill="#472621"/>

    <!-- Neck and Ears -->
    <rect x="355" y="340" width="35" height="45" rx="10" fill="#F8B896"/>
    <!-- Ear left -->
    <ellipse cx="338" cy="305" rx="7" ry="11" fill="#F8B896"/>

    <!-- Head and Face -->
    <path d="M340 285 C335 245 365 235 390 238 C420 242 430 270 425 305 C420 345 390 355 365 352 C345 350 342 315 340 285 Z" fill="#FFCBB0"/>

    <!-- Cute Blush -->
    <ellipse cx="355" cy="318" rx="8" ry="4" fill="#F79679" opacity="0.6"/>
    <ellipse cx="405" cy="316" rx="8" ry="4" fill="#F79679" opacity="0.5"/>

    <!-- Eyes (Focused, friendly, looking forward) -->
    <ellipse cx="372" cy="292" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="374" cy="290" r="1.8" fill="#FFFFFF"/>
    
    <ellipse cx="406" cy="290" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="408" cy="288" r="1.8" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M366 280 Q 374 274 382 278" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M400 278 Q 408 273 416 277" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Nose and Smile -->
    <path d="M393 296 L 396 308 L 391 310" stroke="#E5997B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M384 322 Q 394 330 402 321" stroke="#8A3D28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Front Hair Bangs and Waves -->
    <path d="M342 265 C355 240 405 242 425 258 C410 262 385 260 365 285 C355 298 348 315 346 335 C336 305 338 278 342 265 Z" fill="#58312B"/>
    <path d="M422 262 C435 285 435 320 428 350 C418 335 418 300 422 262 Z" fill="#58312B"/>

    <!-- Yellow Top (Shirt) -->
    <path d="M310 395 C335 375 415 375 440 395 L 455 450 L 295 450 Z" fill="#FFDE17"/>
    <path d="M352 380 Q 375 395 398 380" stroke="#E5C200" stroke-width="3" fill="none"/>

    <!-- Seatbelt (Safety strap crossing shoulder to hip) -->
    <polygon points="268,360 292,350 425,480 395,490" fill="#252445"/>
    <line x1="280" y1="355" x2="410" y2="485" stroke="#3A386D" stroke-width="2"/>

    <!-- Arms and Hands Gripping Steering Wheel -->
    <!-- Left Arm and Hand -->
    <path d="M305 405 C285 415 270 435 260 455 C265 470 290 460 305 445 Z" fill="#FFDE17"/>
    <!-- Left Hand -->
    <path d="M260 435 C255 440 256 460 270 472 C285 478 310 470 312 455 C312 440 285 430 260 435 Z" fill="#F8B896"/>
    <!-- Fingers left -->
    <path d="M265 445 C272 440 285 445 288 455" stroke="#E29775" stroke-width="2" fill="none"/>
    <path d="M272 452 C278 448 290 452 294 462" stroke="#E29775" stroke-width="2" fill="none"/>

    <!-- Right Arm and Hand -->
    <path d="M425 415 C440 425 455 440 462 460 C452 470 435 465 420 445 Z" fill="#FFDE17"/>
    <!-- Right Hand -->
    <path d="M430 435 C425 445 432 468 445 472 C465 476 482 460 480 445 C475 430 450 428 430 435 Z" fill="#F8B896"/>
    <!-- Fingers right -->
    <path d="M440 448 C446 442 458 446 462 456" stroke="#E29775" stroke-width="2" fill="none"/>
    <path d="M448 454 C454 450 465 454 468 464" stroke="#E29775" stroke-width="2" fill="none"/>
  </g>

  <!-- 5. STEERING WHEEL -->
  <g id="steering-wheel">
    <!-- Outer Rim -->
    <circle cx="365" cy="460" r="105" stroke="#3A3E94" stroke-width="24" fill="none"/>
    <circle cx="365" cy="460" r="105" stroke="#4F54BD" stroke-width="6" fill="none" opacity="0.6"/>
    
    <!-- Inner Hub -->
    <circle cx="365" cy="460" r="32" fill="#2E317A"/>
    <circle cx="365" cy="460" r="28" fill="#3D429F"/>
    
    <!-- Spokes with Yellow Contrast Accents -->
    <path d="M272 478 L 335 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M275 478 L 335 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    
    <path d="M458 478 L 395 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M455 478 L 395 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>

    <path d="M365 492 L 365 565" stroke="#3A3E94" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- 6. DASHBOARD AND CONSOLE -->
  <g id="dashboard">
    <!-- Deep Indigo Dashboard Shelf -->
    <path d="M80 440 L 920 440 L 960 495 L 40 495 Z" fill="url(#dashGrad)"/>
    <line x1="80" y1="440" x2="920" y2="440" stroke="#635DB8" stroke-width="3"/>

    <!-- Instrument Cluster Glow behind wheel -->
    <ellipse cx="365" cy="445" rx="80" ry="14" fill="#6962D4" opacity="0.4"/>
  </g>

  <!-- 7. HOLOGRAPHIC GPS NAVIGATION HUD (Translucent Tablet) -->
  <g id="gps-hud-screen" filter="url(#hudShadow)" transform="translate(545, 290)">
    <!-- Slanted Screen Housing with Frosted Glass Look -->
    <polygon points="15,0 155,0 185,150 0,150" fill="url(#glassHudGrad)"/>
    <polygon points="15,0 155,0 185,150 0,150" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.8" fill="none"/>

    <!-- Simulated UI Header Lines -->
    <rect x="30" y="20" width="75" height="7" rx="3.5" fill="#887BC7" opacity="0.6"/>
    <rect x="30" y="34" width="105" height="5" rx="2.5" fill="#887BC7" opacity="0.35"/>
    <rect x="30" y="44" width="90" height="5" rx="2.5" fill="#887BC7" opacity="0.35"/>

    <!-- Route Line Path: Start to End -->
    <path d="M42 125 C45 105 85 105 80 85 C75 68 115 65 125 58" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M42 125 C45 105 85 105 80 85 C75 68 115 65 125 58" stroke="#8874E6" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Start Waypoint Dot -->
    <circle cx="42" cy="125" r="5" fill="#FFFFFF"/>
    <circle cx="42" cy="125" r="2.5" fill="#8874E6"/>

    <!-- Destination Mark -->
    <g transform="translate(125, 58)">
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- UI Pagination Dots at Bottom -->
    <circle cx="115" cy="132" r="2.5" fill="#887BC7" opacity="0.5"/>
    <circle cx="125" cy="132" r="2.5" fill="#887BC7" opacity="0.5"/>
    <circle cx="135" cy="132" r="2.5" fill="#887BC7" opacity="0.8"/>
  </g>

  <!-- 8. WINDSHIELD FRAME AND CAR CHASSIS (Foreground Silhouette) -->
  <g id="car-windshield-frame">
    <!-- Windshield Glass Reflections -->
    <polygon points="120,225 880,225 940,440 60,440" fill="url(#windshieldSheen)"/>

    <!-- Center Rearview Mirror -->
    <rect x="470" y="222" width="60" height="22" rx="7" fill="#4B399E"/>
    <rect x="495" y="208" width="10" height="15" fill="#3A2D7C"/>

    <!-- Car Front Lower Hood Panel -->
    <path d="M40 480 C180 470 820 470 960 480 L 1000 620 L 0 620 Z" fill="url(#carHoodGrad)"/>
    <path d="M80 488 C240 480 760 480 920 488 L 945 540 C800 535 200 535 55 540 Z" fill="#9377EE" opacity="0.5"/>

    <!-- Left and Right A-Pillars and Top Frame -->
    <path d="M0 620 L 60 490 L 175 235 C185 215 215 200 250 200 L 750 200 C785 200 815 215 825 235 L 940 490 L 1000 620 L 940 620 L 870 450 L 795 240 C790 230 775 225 750 225 L 250 225 C225 225 210 230 205 240 L 130 450 L 60 620 Z" fill="url(#carPillarGrad)"/>

    <!-- Roof Visor Line -->
    <path d="M220 220 L 780 220 L 760 205 L 240 205 Z" fill="url(#carRoofGrad)"/>

    <!-- Quarter-Glass Window Divider Bars (Left and Right) -->
    <!-- Left Pillar Divider -->
    <polygon points="120,440 135,440 245,225 235,225" fill="#7552D8"/>
    <!-- Right Pillar Divider -->
    <polygon points="880,440 865,440 755,225 765,225" fill="#7552D8"/>
  </g>
</svg>
