<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 190 1000 430" width="1000" height="430" fill="none">
  <defs>
    <!-- Car Frame Gradients -->
    <linearGradient id="cockpitPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A58DF6"/>
      <stop offset="50%" stop-color="#9375ED"/>
      <stop offset="100%" stop-color="#7B56DE"/>
    </linearGradient>

    <linearGradient id="cockpitRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B29CFA"/>
      <stop offset="100%" stop-color="#8F71EC"/>
    </linearGradient>

    <linearGradient id="cockpitHood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E6FE8"/>
      <stop offset="40%" stop-color="#7B58DB"/>
      <stop offset="100%" stop-color="#6741C9"/>
    </linearGradient>

    <linearGradient id="cockpitDash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C479B"/>
      <stop offset="40%" stop-color="#342D7C"/>
      <stop offset="100%" stop-color="#241E5C"/>
    </linearGradient>

    <linearGradient id="cockpitSeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C68DA"/>
      <stop offset="100%" stop-color="#5842B8"/>
    </linearGradient>

    <linearGradient id="cockpitHudGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#EAE6FF" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#D6CEF8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="cockpitWindshieldSheen" x1="20%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="cockpitDriverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1344" flood-opacity="0.3"/>
    </filter>
    <filter id="cockpitHudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201850" flood-opacity="0.25"/>
    </filter>

    <!-- Checkered Shirt Pattern for Indian Instructor -->
    <pattern id="checkShirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#DC2626"/>
      <rect x="0" y="0" width="8" height="16" fill="#1E3A8A" opacity="0.6"/>
      <rect x="0" y="0" width="16" height="8" fill="#1E3A8A" opacity="0.6"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85"/>
    </pattern>
  </defs>

  <!-- 1. CAR SEATS AND HEADRESTS (Visible inside cabin) -->
  <!-- Driver Seat (Left) -->
  <g fill="url(#cockpitSeat)">
    <rect x="365" y="240" width="85" height="55" rx="16"/>
    <rect x="395" y="290" width="25" height="20" fill="#4B399E"/>
    <path d="M345 305 C345 295 470 295 470 305 L475 440 L340 440 Z"/>
  </g>

  <!-- Passenger Seat (Right) -->
  <g fill="url(#cockpitSeat)">
    <rect x="560" y="240" width="130" height="60" rx="18"/>
    <rect x="612" y="295" width="26" height="20" fill="#4B399E"/>
    <path d="M530 310 C530 298 700 298 700 310 L705 440 L525 440 Z"/>
  </g>

  <!-- 2. THE DRIVER (Female Learner Character) -->
  <g id="driver-cockpit-girl" filter="url(#cockpitDriverShadow)">
    <!-- Back Hair -->
    <path d="M275 380 C265 310 295 240 370 230 C445 220 465 295 450 370 C440 410 420 440 405 440 C370 440 360 410 330 430 C300 450 280 430 275 380 Z" fill="#472621"/>

    <!-- Neck and Ears -->
    <rect x="355" y="340" width="35" height="45" rx="10" fill="#F8B896"/>
    <ellipse cx="338" cy="305" rx="7" ry="11" fill="#F8B896"/>

    <!-- Head and Face -->
    <path d="M340 285 C335 245 365 235 390 238 C420 242 430 270 425 305 C420 345 390 355 365 352 C345 350 342 315 340 285 Z" fill="#FFCBB0"/>

    <!-- Cute Blush -->
    <ellipse cx="355" cy="318" rx="8" ry="4" fill="#F79679" opacity="0.6"/>
    <ellipse cx="405" cy="316" rx="8" ry="4" fill="#F79679" opacity="0.5"/>

    <!-- Eyes (Focused, friendly, looking ahead at the road) -->
    <ellipse cx="372" cy="292" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="374" cy="290" r="1.8" fill="#FFFFFF"/>
    
    <ellipse cx="406" cy="290" rx="4.5" ry="6.5" fill="#201515"/>
    <circle cx="408" cy="288" r="1.8" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M366 280 Q 374 274 382 278" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M400 278 Q 408 273 416 277" stroke="#472621" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Nose and Smile -->
    <path d="M393 296 L 396 308 L 391 310" stroke="#E5997B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M384 322 Q 394 330 402 321" stroke="#8A3D28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Front Hair Bangs and Waves -->
    <path d="M342 265 C355 240 405 242 425 258 C410 262 385 260 365 285 C355 298 348 315 346 335 C336 305 338 278 342 265 Z" fill="#58312B"/>
    <path d="M422 262 C435 285 435 320 428 350 C418 335 418 300 422 262 Z" fill="#58312B"/>

    <!-- Yellow Top (Shirt) -->
    <path d="M310 395 C335 375 415 375 440 395 L 455 450 L 295 450 Z" fill="#FFDE17"/>
    <path d="M352 380 Q 375 395 398 380" stroke="#E5C200" stroke-width="3" fill="none"/>

    <!-- Seatbelt (Safety strap) -->
    <polygon points="268,360 292,350 425,480 395,490" fill="#252445"/>
    <line x1="280" y1="355" x2="410" y2="485" stroke="#3A386D" stroke-width="2"/>

    <!-- Left Arm and Hand -->
    <path d="M305 405 C285 415 270 435 260 455 C265 470 290 460 305 445 Z" fill="#FFDE17"/>
    <path d="M260 435 C255 440 256 460 270 472 C285 478 310 470 312 455 C312 440 285 430 260 435 Z" fill="#F8B896"/>
    <path d="M265 445 C272 440 285 445 288 455" stroke="#E29775" stroke-width="2" fill="none"/>
    <path d="M272 452 C278 448 290 452 294 462" stroke="#E29775" stroke-width="2" fill="none"/>

    <!-- Right Arm and Hand -->
    <path d="M425 415 C440 425 455 440 462 460 C452 470 435 465 420 445 Z" fill="#FFDE17"/>
    <path d="M430 435 C425 445 432 468 445 472 C465 476 482 460 480 445 C475 430 450 428 430 435 Z" fill="#F8B896"/>
    <path d="M440 448 C446 442 458 446 462 456" stroke="#E29775" stroke-width="2" fill="none"/>
    <path d="M448 454 C454 450 465 454 468 464" stroke="#E29775" stroke-width="2" fill="none"/>
  </g>

  <!-- 3. STEERING WHEEL -->
  <g id="cockpit-steering-wheel">
    <circle cx="365" cy="460" r="105" stroke="#3A3E94" stroke-width="24" fill="none"/>
    <circle cx="365" cy="460" r="105" stroke="#4F54BD" stroke-width="6" fill="none" opacity="0.6"/>
    
    <circle cx="365" cy="460" r="32" fill="#2E317A"/>
    <circle cx="365" cy="460" r="28" fill="#3D429F"/>
    
    <path d="M272 478 L 335 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M275 478 L 335 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>
    
    <path d="M458 478 L 395 465" stroke="#3A3E94" stroke-width="16" stroke-linecap="round"/>
    <path d="M455 478 L 395 465" stroke="#FFDE17" stroke-width="5" stroke-linecap="round"/>

    <path d="M365 492 L 365 565" stroke="#3A3E94" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- 4. DASHBOARD AND CONSOLE -->
  <g id="cockpit-dashboard">
    <path d="M80 440 L 920 440 L 960 495 L 40 495 Z" fill="url(#cockpitDash)"/>
    <line x1="80" y1="440" x2="920" y2="440" stroke="#635DB8" stroke-width="3"/>
    <ellipse cx="365" cy="445" rx="80" ry="14" fill="#6962D4" opacity="0.4"/>
  </g>

  <!-- 5. THE INSTRUCTOR (Indian male in 40s, friendly mentor, check shirt teaching student) -->
  <g id="instructor-male" filter="url(#cockpitDriverShadow)">
    <!-- Back Hair & Silhouette -->
    <path d="M580 252 C580 220 608 210 635 212 C665 210 690 225 690 255 C690 280 685 305 675 320 L675 355 L585 355 L585 320 C578 305 580 275 580 252 Z" fill="#1A181C"/>
    
    <!-- Neck -->
    <rect x="608" y="325" width="46" height="42" rx="10" fill="#B3734A"/>
    <path d="M608 340 Q 631 352 654 340 L 654 365 L 608 365 Z" fill="#995E39" opacity="0.4"/>

    <!-- Head & Face (Friendly 40s Indian Instructor) -->
    <path d="M592 270 C590 230 615 225 632 225 C655 225 675 235 675 275 C675 320 660 342 633 342 C608 342 594 315 592 270 Z" fill="#C5855A"/>

    <!-- Ears -->
    <ellipse cx="589" cy="285" rx="8" ry="14" fill="#B3734A"/>
    <ellipse cx="590" cy="285" rx="4" ry="8" fill="#995E39" opacity="0.6"/>
    <ellipse cx="674" cy="285" rx="7" ry="13" fill="#B3734A"/>

    <!-- Hair (Neat short side-part with distinguished temple styling) -->
    <path d="M584 252 C585 225 612 210 635 210 C662 210 684 225 684 250 C680 255 670 242 655 240 C635 238 610 248 584 252 Z" fill="#1F1D22"/>
    <path d="M584 248 C584 265 588 275 592 278 L592 258 Z" fill="#1F1D22"/>
    <!-- Subtle distinguished grey hair highlights near temples -->
    <path d="M587 260 Q 590 270 592 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M674 260 Q 672 270 670 275" stroke="#9E9E9E" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyebrows (Warm, expressive, encouraging teacher) -->
    <path d="M602 268 Q 614 262 624 267" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M640 267 Q 650 262 662 268" stroke="#1F1D22" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Attentive, glancing warmly at the student/road) -->
    <ellipse cx="614" cy="280" rx="5" ry="6" fill="#1B130E"/>
    <circle cx="613" cy="278" r="1.8" fill="#FFFFFF"/>
    <path d="M605 284 Q 602 286 600 288" stroke="#995E39" stroke-width="1.2" stroke-linecap="round"/>

    <ellipse cx="650" cy="280" rx="5" ry="6" fill="#1B130E"/>
    <circle cx="649" cy="278" r="1.8" fill="#FFFFFF"/>
    <path d="M658 284 Q 662 286 664 288" stroke="#995E39" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Friendly Nose -->
    <path d="M632 275 L 634 298 L 626 302" stroke="#995E39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Distinguished Indian Mustache -->
    <path d="M612 312 C622 308 630 311 632 313 C634 311 642 308 652 312 C656 314 650 322 632 320 C614 322 608 314 612 312 Z" fill="#1F1D22"/>

    <!-- Gentle Mentor Smile -->
    <path d="M622 325 Q 632 332 642 325" stroke="#7A3F1F" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cheerful Face Shadows / Cheek Dimples -->
    <ellipse cx="602" cy="298" rx="8" ry="4" fill="#B36A3D" opacity="0.4"/>
    <ellipse cx="660" cy="298" rx="8" ry="4" fill="#B36A3D" opacity="0.4"/>

    <!-- Body: Wearing Checkered Button-Up Shirt -->
    <g id="instructor-shirt">
      <!-- Main Shirt Body -->
      <path d="M555 365 C580 350 680 350 710 365 L 725 450 L 535 450 Z" fill="url(#checkShirt)"/>
      
      <!-- Collar -->
      <polygon points="610,360 632,385 620,365" fill="#DC2626"/>
      <polygon points="610,360 632,385 620,365" fill="url(#checkShirt)"/>
      <polygon points="654,360 632,385 644,365" fill="#DC2626"/>
      <polygon points="654,360 632,385 644,365" fill="url(#checkShirt)"/>
      <path d="M608 358 L 632 385 L 656 358" stroke="#1E3A8A" stroke-width="2" fill="none"/>

      <!-- Front Placket & Buttons -->
      <line x1="632" y1="385" x2="632" y2="450" stroke="#B91C1C" stroke-width="8"/>
      <circle cx="632" cy="398" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="418" r="2.5" fill="#FFFFFF"/>
      <circle cx="632" cy="438" r="2.5" fill="#FFFFFF"/>

      <!-- Left Arm & Hand (Teaching gesture: open guiding hand pointing calmly ahead) -->
      <path d="M555 375 C540 390 525 410 515 435 C520 445 540 440 550 425 Z" fill="url(#checkShirt)"/>
      <path d="M515 425 C508 430 500 442 510 452 C522 458 542 450 546 438 C546 425 528 418 515 425 Z" fill="#C5855A"/>
      <!-- Fingers guiding forward gently toward student / road -->
      <path d="M508 438 Q 498 435 490 436" stroke="#B3734A" stroke-width="3" stroke-linecap="round"/>
      <path d="M508 444 Q 496 442 488 444" stroke="#B3734A" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Right Arm (Holding Instructor Lesson Clipboard) -->
      <path d="M700 375 C715 390 725 410 730 435 L 695 440 Z" fill="url(#checkShirt)"/>
      
      <!-- Instructor Clipboard / Progress Checklist -->
      <g transform="translate(670, 360) rotate(-6)">
        <!-- Board -->
        <rect x="0" y="0" width="60" height="75" rx="5" fill="#854D0E"/>
        <rect x="3" y="6" width="54" height="65" rx="3" fill="#F8FAFC"/>
        <rect x="18" y="-4" width="24" height="8" rx="2" fill="#94A3B8"/>
        <!-- Sheet text lines & green checks -->
        <line x1="8" y1="16" x2="35" y2="16" stroke="#334155" stroke-width="2.5"/>
        <path d="M42 16 L 46 20 L 52 14" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        
        <line x1="8" y1="28" x2="38" y2="28" stroke="#334155" stroke-width="2.5"/>
        <path d="M42 28 L 46 32 L 52 26" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <line x1="8" y1="40" x2="32" y2="40" stroke="#334155" stroke-width="2.5"/>
        <path d="M42 40 L 46 44 L 52 38" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Instructor Hand holding board -->
        <ellipse cx="10" cy="55" rx="9" ry="6" fill="#C5855A"/>
        <circle cx="16" cy="53" r="3.5" fill="#C5855A"/>
      </g>
    </g>

    <!-- Seatbelt across Instructor (Safety First!) -->
    <polygon points="685,355 708,348 575,480 550,490" fill="#252445"/>
    <line x1="695" y1="352" x2="565" y2="485" stroke="#3A386D" stroke-width="2"/>
  </g>

  <!-- 6. WINDSHIELD FRAME & CAR CHASSIS (Foreground Silhouette with Transparent Glass Opening) -->
  <g id="cockpit-outer-frame">
    <!-- Subtle Windshield Glass Reflections across open view -->
    <polygon points="120,225 880,225 940,440 60,440" fill="url(#cockpitWindshieldSheen)"/>

    <!-- Center Rearview Mirror -->
    <rect x="470" y="222" width="60" height="22" rx="7" fill="#4B399E"/>
    <rect x="495" y="208" width="10" height="15" fill="#3A2D7C"/>

    <!-- Car Front Lower Hood Panel -->
    <path d="M40 480 C180 470 820 470 960 480 L 1000 620 L 0 620 Z" fill="url(#cockpitHood)"/>
    <path d="M80 488 C240 480 760 480 920 488 L 945 540 C800 535 200 535 55 540 Z" fill="#9377EE" opacity="0.5"/>

    <!-- Left and Right A-Pillars and Top Roof Frame -->
    <path d="M0 620 L 60 490 L 175 235 C185 215 215 200 250 200 L 750 200 C785 200 815 215 825 235 L 940 490 L 1000 620 L 940 620 L 870 450 L 795 240 C790 230 775 225 750 225 L 250 225 C225 225 210 230 205 240 L 130 450 L 60 620 Z" fill="url(#cockpitPillar)"/>

    <!-- Roof Visor Line -->
    <path d="M220 220 L 780 220 L 760 205 L 240 205 Z" fill="url(#cockpitRoof)"/>

    <!-- Quarter-Glass Window Divider Bars -->
    <polygon points="120,440 135,440 245,225 235,225" fill="#7552D8"/>
    <polygon points="880,440 865,440 755,225 765,225" fill="#7552D8"/>
  </g>
</svg>
