<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="safeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE642"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C80F2"/>
      <stop offset="50%" stop-color="#8059E0"/>
      <stop offset="100%" stop-color="#5E38C2"/>
    </linearGradient>
    <linearGradient id="pedalMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="safeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4B2DA8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Yellow Disc -->
  <circle cx="250" cy="200" r="155" fill="url(#safeYellow)" opacity="0.95"/>
  <ellipse cx="250" cy="335" rx="135" ry="22" fill="#E29E00" opacity="0.3"/>

  <!-- Radar Sensor Rings (Safety Field) -->
  <ellipse cx="250" cy="210" rx="180" ry="85" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity="0.8"/>
  <ellipse cx="250" cy="210" rx="140" ry="65" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.9"/>

  <!-- Training Car Silhouette with Dual Controls (Center) -->
  <g transform="translate(130, 110)" filter="url(#safeShadow)">
    <!-- Car Body -->
    <path d="M25 90 C35 60 70 45 110 45 L170 45 C205 45 225 65 235 90 L245 105 C245 115 240 120 230 120 L15 120 C5 120 0 115 5 105 Z" fill="#8B6CE6"/>
    
    <!-- Windshield & Windows -->
    <path d="M40 85 C48 65 75 55 105 55 L125 55 L125 85 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M135 55 L165 55 C190 55 208 65 215 85 L135 85 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- Wheels -->
    <circle cx="65" cy="120" r="22" fill="#31276C"/>
    <circle cx="65" cy="120" r="10" fill="#FFE033"/>
    
    <circle cx="190" cy="120" r="22" fill="#31276C"/>
    <circle cx="190" cy="120" r="10" fill="#FFE033"/>

    <!-- Headlights & Taillights -->
    <rect x="0" y="96" width="8" height="12" rx="3" fill="#EF4444"/>
    <rect x="240" y="96" width="8" height="12" rx="3" fill="#FFE033"/>
  </g>

  <!-- Dual Control Pedal Mechanic (Left Foreground Spotlight) -->
  <g transform="translate(70, 180)" filter="url(#safeShadow)">
    <rect width="130" height="135" rx="18" fill="#FFFFFF"/>
    
    <!-- Dual Pedals Title -->
    <text x="65" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#31276C" text-anchor="middle">DUAL CONTROLS</text>
    
    <!-- Brake & Clutch Pedals (Metal with Rubber Ribs) -->
    <!-- Instructor Brake (Left) -->
    <rect x="25" y="38" width="32" height="58" rx="6" fill="#31276C"/>
    <rect x="28" y="42" width="26" height="50" rx="4" fill="url(#pedalMetal)"/>
    <line x1="32" y1="52" x2="50" y2="52" stroke="#31276C" stroke-width="2"/>
    <line x1="32" y1="62" x2="50" y2="62" stroke="#31276C" stroke-width="2"/>
    <line x1="32" y1="72" x2="50" y2="72" stroke="#31276C" stroke-width="2"/>
    <line x1="32" y1="82" x2="50" y2="82" stroke="#31276C" stroke-width="2"/>
    <text x="41" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#EF4444" text-anchor="middle">BRAKE</text>

    <!-- Accelerator / Safety Pedal (Right) -->
    <rect x="73" y="44" width="28" height="52" rx="6" fill="#31276C"/>
    <rect x="76" y="48" width="22" height="44" rx="4" fill="url(#pedalMetal)"/>
    <line x1="80" y1="58" x2="94" y2="58" stroke="#31276C" stroke-width="2"/>
    <line x1="80" y1="68" x2="94" y2="68" stroke="#31276C" stroke-width="2"/>
    <line x1="80" y1="78" x2="94" y2="78" stroke="#31276C" stroke-width="2"/>
    <text x="87" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">SAFETY</text>
  </g>

  <!-- Big 3D Protective Shield (Right Foreground) -->
  <g transform="translate(305, 140)" filter="url(#safeShadow)">
    <path d="M60 0 C100 15 120 40 120 80 C120 135 60 170 60 170 C60 170 0 135 0 80 C0 40 20 15 60 0 Z" fill="url(#shieldGrad)"/>
    
    <!-- Inner Gold Inlay & Checkmark -->
    <path d="M60 15 C92 27 106 48 106 82 C106 126 60 154 60 154 C60 154 14 126 14 82 C14 48 28 27 60 15 Z" fill="#FFE033" opacity="0.25"/>

    <!-- Prominent White Safety Checkmark -->
    <path d="M36 84 L52 100 L84 64" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Small 5-Star Tag -->
    <rect x="18" y="125" width="84" height="22" rx="11" fill="#FFFFFF"/>
    <text x="60" y="139" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#31276C" text-anchor="middle">100% SAFE</text>
  </g>
</svg>
