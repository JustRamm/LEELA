<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="schedYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE642"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="schedPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C80F2"/>
      <stop offset="100%" stop-color="#6741CA"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3482"/>
      <stop offset="100%" stop-color="#231E54"/>
    </linearGradient>
    <filter id="schedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4B2DA8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Warm Yellow Organic Bubble -->
  <path d="M70 180 C50 80 160 30 260 40 C370 50 440 120 430 230 C420 340 310 380 210 370 C110 360 80 270 70 180 Z" fill="url(#schedYellow)" opacity="0.95"/>

  <!-- Curved Road Pathway -->
  <path d="M50 350 C120 280 200 320 280 240 C350 170 420 200 460 140" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M50 350 C120 280 200 320 280 240 C350 170 420 200 460 140" stroke="#8B6CE6" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M50 350 C120 280 200 320 280 240 C350 170 420 200 460 140" stroke="#FFDE17" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none"/>

  <!-- Main Component: 3D Booking Calendar (Center-Left) -->
  <g transform="translate(110, 80)" filter="url(#schedShadow)">
    <!-- Calendar Body -->
    <rect width="210" height="230" rx="22" fill="#FFFFFF"/>
    <!-- Header (Violet) -->
    <path d="M0 22 C0 10 10 0 22 0 L188 0 C200 0 210 10 210 22 L210 65 L0 65 Z" fill="url(#schedPurple)"/>
    
    <!-- Binding Rings -->
    <rect x="45" y="-10" width="14" height="25" rx="7" fill="#FFDE17"/>
    <rect x="151" y="-10" width="14" height="25" rx="7" fill="#FFDE17"/>

    <!-- Calendar Month Title -->
    <text x="105" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BOOK LESSON</text>

    <!-- Grid Dates / Time Slots -->
    <g transform="translate(25, 85)">
      <!-- Row 1 -->
      <circle cx="20" cy="18" r="14" fill="#F1F5F9"/>
      <circle cx="60" cy="18" r="14" fill="#F1F5F9"/>
      <circle cx="100" cy="18" r="14" fill="#F1F5F9"/>
      <circle cx="140" cy="18" r="14" fill="#F1F5F9"/>

      <!-- Row 2 (Selected Golden Day) -->
      <circle cx="20" cy="58" r="14" fill="#F1F5F9"/>
      <circle cx="60" cy="58" r="17" fill="#FFDE17"/>
      <!-- Steering icon inside selected date -->
      <circle cx="60" cy="58" r="9" stroke="#31276C" stroke-width="2" fill="none"/>
      <circle cx="60" cy="58" r="3" fill="#31276C"/>

      <circle cx="100" cy="58" r="14" fill="#F1F5F9"/>
      <circle cx="140" cy="58" r="14" fill="#8B6CE6"/>
      <text x="140" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">24</text>

      <!-- Row 3 -->
      <circle cx="20" cy="98" r="14" fill="#F1F5F9"/>
      <circle cx="60" cy="98" r="14" fill="#F1F5F9"/>
      <circle cx="100" cy="98" r="14" fill="#F1F5F9"/>
      <circle cx="140" cy="98" r="14" fill="#F1F5F9"/>
    </g>
  </g>

  <!-- Modern Smart Car Key Fob (Bottom Right Floating) -->
  <g transform="translate(290, 210)" filter="url(#schedShadow)">
    <!-- Key Fob Body -->
    <rect width="95" height="150" rx="28" fill="url(#keyGrad)"/>
    <rect x="5" y="5" width="85" height="140" rx="24" stroke="#8B6CE6" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Key Buttons -->
    <!-- Unlock Button -->
    <circle cx="47" cy="45" r="18" fill="#3A3475"/>
    <path d="M42 45 L42 40 C42 36 52 36 52 40 L52 42" stroke="#FFDE17" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="40" y="44" width="14" height="10" rx="2" fill="#FFDE17"/>

    <!-- Trunk / Start Button -->
    <circle cx="47" cy="90" r="15" fill="#FFDE17"/>
    <text x="47" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#31276C" text-anchor="middle">GO</text>

    <!-- Key Blade Accent (Top Ring) -->
    <path d="M47 0 L 47 -15 C47 -25 65 -25 65 -15 L 65 0" stroke="#FFDE17" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Signal Radiating Waves -->
    <path d="M70 20 C85 30 85 55 70 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M80 10 C105 25 105 70 80 80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Floating Flexible Clock Badge (Top Right) -->
  <g transform="translate(320, 60)" filter="url(#schedShadow)">
    <circle cx="40" cy="40" r="38" fill="#FFFFFF"/>
    <circle cx="40" cy="40" r="32" fill="#8B6CE6"/>
    <!-- Clock Hands -->
    <circle cx="40" cy="40" r="4" fill="#FFDE17"/>
    <line x1="40" y1="40" x2="40" y2="24" stroke="#FFDE17" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="54" y2="40" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
