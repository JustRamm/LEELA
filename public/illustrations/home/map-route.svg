<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="mapYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE642"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="mapCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="mapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4B2DA8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background Yellow Disc -->
  <circle cx="250" cy="200" r="160" fill="url(#mapYellow)" opacity="0.95"/>

  <!-- Stylized Map Canvas Container (Tilted slightly) -->
  <g transform="translate(60, 50)" filter="url(#mapShadow)">
    <rect width="380" height="300" rx="24" fill="url(#mapCard)"/>

    <!-- Map Grid Gridlines -->
    <path d="M0 60 L 380 60" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M0 120 L 380 120" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M0 180 L 380 180" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M0 240 L 380 240" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M70 0 L 70 300" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M140 0 L 140 300" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M210 0 L 210 300" stroke="#F1F5F9" stroke-width="2"/>
    <path d="M280 0 L 280 300" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Road 1 (Secondary Gray Road) -->
    <path d="M30 220 Q 150 250 200 180 T 360 160" stroke="#E2E8F0" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Main Test Route (Indigo & Violet Highway with Roundabout) -->
    <!-- Roundabout circle -->
    <circle cx="230" cy="140" r="38" stroke="#8B6CE6" stroke-width="22" fill="none"/>
    <circle cx="230" cy="140" r="18" fill="#F8FAFC"/>
    <!-- Roundabout arrows -->
    <path d="M220 114 Q 235 110 246 118" stroke="#FFE033" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Connecting Route Paths -->
    <path d="M50 250 C80 240 110 180 180 150 L 205 145" stroke="#8B6CE6" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M255 130 C290 110 310 90 330 60" stroke="#8B6CE6" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Dashed Route Centerline (Golden) -->
    <path d="M50 250 C80 240 110 180 180 150" stroke="#FFDE17" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
    <path d="M255 130 C290 110 310 90 330 60" stroke="#FFDE17" stroke-width="4" stroke-dasharray="6 6" fill="none"/>

    <!-- START LOCATION PIN (Purple with Car Icon) -->
    <g transform="translate(40, 205)">
      <!-- Pin shape -->
      <path d="M16 0 C7 0 0 7 0 16 C0 28 16 44 16 44 C16 44 32 28 32 16 C32 7 25 0 16 0 Z" fill="#31276C"/>
      <circle cx="16" cy="15" r="9" fill="#FFDE17"/>
      <circle cx="16" cy="15" r="4" fill="#31276C"/>
      <rect x="-10" y="46" width="52" height="18" rx="9" fill="#31276C"/>
      <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">START</text>
    </g>

    <!-- MANEUVER CHECKPOINT 1: PARKING BADGE -->
    <g transform="translate(145, 175)">
      <circle cx="18" cy="18" r="16" fill="#3B82F6"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">P</text>
    </g>

    <!-- SPEED LIMIT 30 SIGN -->
    <g transform="translate(290, 150)">
      <circle cx="16" cy="16" r="16" fill="#EF4444"/>
      <circle cx="16" cy="16" r="12" fill="#FFFFFF"/>
      <text x="16" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#111111" text-anchor="middle">30</text>
    </g>

    <!-- FINISH FLAG (Test Center) -->
    <g transform="translate(325, 20)">
      <!-- Flag pole -->
      <line x1="5" y1="0" x2="5" y2="40" stroke="#31276C" stroke-width="3" stroke-linecap="round"/>
      <!-- Checkered Flag -->
      <rect x="5" y="0" width="30" height="20" rx="3" fill="#10B981"/>
      <path d="M12 10 L 17 15 L 26 5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <rect x="15" y="40" width="55" height="18" rx="9" fill="#10B981"/>
      <text x="42.5" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">TEST PASSED</text>
    </g>
  </g>
</svg>
