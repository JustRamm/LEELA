<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="passYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE642"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="passPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C80F2"/>
      <stop offset="100%" stop-color="#6741CA"/>
    </linearGradient>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D98E00"/>
    </linearGradient>
    <filter id="passShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4B2DA8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Warm Yellow Disc with Soft Waves -->
  <circle cx="250" cy="200" r="155" fill="url(#passYellow)" opacity="0.95"/>
  <ellipse cx="250" cy="330" rx="140" ry="25" fill="#E59E00" opacity="0.35"/>

  <!-- Celebratory Confetti & Stars -->
  <polygon points="90,90 94,102 106,102 96,110 100,122 90,114 80,122 84,110 74,102 86,102" fill="#8B6CE6"/>
  <polygon points="410,110 413,120 423,120 415,126 418,136 410,130 402,136 405,126 397,120 407,120" fill="#8B6CE6"/>
  <polygon points="390,280 393,288 401,288 395,293 397,301 390,296 383,301 385,293 379,288 387,288" fill="#FFFFFF"/>
  <circle cx="110" cy="270" r="6" fill="#8B6CE6"/>
  <circle cx="380" cy="70" r="8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="130" cy="140" r="5" fill="#FFFFFF"/>

  <!-- The Driving License Card (Center, tilted slightly for dynamic depth) -->
  <g transform="translate(85, 95) rotate(-4 150 100)" filter="url(#passShadow)">
    <!-- Card Base -->
    <rect width="310" height="195" rx="18" fill="#FFFFFF"/>
    
    <!-- Top Header Bar (Violet) -->
    <path d="M0 18 C0 8 8 0 18 0 L292 0 C302 0 310 8 310 18 L310 52 L0 52 Z" fill="url(#passPurple)"/>
    
    <!-- Card Title -->
    <text x="22" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">DRIVER'S LICENSE</text>
    <text x="22" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#FFDE17">CATEGORY B • PASSED 1ST TRY</text>

    <!-- Smart Chip Gold Icon -->
    <rect x="22" y="70" width="36" height="28" rx="6" fill="url(#goldMedal)"/>
    <line x1="22" y1="84" x2="58" y2="84" stroke="#B87D00" stroke-width="1.5"/>
    <line x1="40" y1="70" x2="40" y2="98" stroke="#B87D00" stroke-width="1.5"/>

    <!-- Driver Photo Silhouette -->
    <rect x="22" y="108" width="65" height="72" rx="10" fill="#F1EDFC"/>
    <!-- Head & shoulders -->
    <circle cx="54" cy="134" r="14" fill="#8B6CE6"/>
    <path d="M34 175 C34 155 42 150 54 150 C66 150 74 155 74 175 Z" fill="#8B6CE6"/>

    <!-- License Data Lines -->
    <g transform="translate(100, 75)">
      <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">FULL NAME</text>
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#2D2353">ALEX MORGAN</text>

      <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">STATUS</text>
      <rect x="0" y="48" width="80" height="20" rx="10" fill="#E8F9EE"/>
      <text x="40" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#059669" text-anchor="middle">PASSED ✓</text>

      <text x="0" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">VALID NATIONWIDE</text>
      <rect x="0" y="94" width="110" height="5" rx="2.5" fill="#E2E8F0"/>
    </g>

    <!-- Holographic Watermark Steering Wheel on License -->
    <circle cx="260" cy="130" r="32" stroke="#8B6CE6" stroke-width="3" stroke-dasharray="4 4" fill="none" opacity="0.25"/>
  </g>

  <!-- 1st-Time Pass Golden Medal & Laurel Ribbon (Right Foreground) -->
  <g transform="translate(310, 160)" filter="url(#passShadow)">
    <!-- Ribbon Tails -->
    <polygon points="40,90 20,150 45,135 70,150 50,90" fill="#8B6CE6"/>
    <polygon points="65,90 45,150 70,135 95,150 75,90" fill="#6741CA"/>

    <!-- Gold Medal Disc -->
    <circle cx="55" cy="55" r="50" fill="url(#goldMedal)"/>
    <circle cx="55" cy="55" r="42" fill="#FFFFFF"/>
    <circle cx="55" cy="55" r="38" fill="url(#goldMedal)"/>

    <!-- Number 1 & Stars -->
    <text x="55" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">1<tspan font-size="16">st</tspan></text>
    <text x="55" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PASS</text>
  </g>
</svg>
